<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Drawer — g-lab</title><link rel="stylesheet" href="../../css/glab.css"><style>body{padding:20px;}</style></head>
<body>
<div style="position:relative;height:290px;border-radius:12px;overflow:hidden"><div class="overlay" style="position:absolute"></div>
<aside class="drawer" style="position:absolute;top:0;right:0;bottom:0;width:340px">
<div class="drawer-head"><h3>Novo aditivo</h3><button class="close-x" aria-label="Fechar"><svg class="" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
<div class="drawer-body"><div class="field"><label>Tipo</label><select><option>Prazo</option></select></div><div class="field"><label>Nova vigência</label><input type="date" value="2027-03-01"></div></div>
<div class="drawer-foot"><button class="btn btn-ghost">Cancelar</button><button class="btn btn-primary">Salvar</button></div></aside></div>
</body>
</html>
